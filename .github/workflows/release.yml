# Every push to the default branch that changes the generator becomes a release: the next patch version of the
# ReleaseSeries in the csproj (v1.0.0, v1.0.1, ...), with Typesafe.PgTopics.Generator.dll attached. Apps that don't pin
# PgTopicsVersion pick it up on their next build. The integration tests run first, against a Postgres service
# container; nothing is released if they fail. Uses the built-in GITHUB_TOKEN, so there are no keys to manage.
name: release

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/release.yml'
  workflow_dispatch: # release manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: release # two quick pushes must not compute the same version
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the latest version

      - name: Next version
        id: version
        run: |
          series=$(sed -n 's:.*<ReleaseSeries>\(.*\)</ReleaseSeries>.*:\1:p' src/Typesafe.PgTopics.Generator/Typesafe.PgTopics.Generator.csproj)
          latest=$(git tag --list "v$series.*" --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then patch=0; else patch=$(( ${latest##*.} + 1 )); fi
          echo "version=$series.$patch" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/Typesafe.PgTopics.Tests
        env:
          PGTOPICS_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

      - run: dotnet build src/Typesafe.PgTopics.Generator -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Release
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          src/Typesafe.PgTopics.Generator/bin/Release/netstandard2.0/Typesafe.PgTopics.Generator.dll
          --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
